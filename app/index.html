<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Dani Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>
  <header>
    <div>
      <h1 id="title">Hola</h1>
      <p id="date"></p>
    </div>
    <div class="right">
      <div id="clock">--:--</div>
      <div id="weather"></div>
    </div>
  </header>
  <main id="grid"></main>
  <footer>
    <span><b class="dot red"></b>Recargar</span>
    <span><b class="dot green"></b>Modo compacto</span>
    <span id="status"></span>
  </footer>
  <script src="launcher.js"></script>
</body>
</html>
