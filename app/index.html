<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Dani Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="size-m font-sans style-tvos">
  <div id="bg"></div>
  <header>
    <div>
      <h1 id="title">Hola</h1>
      <p id="date"></p>
    </div>
    <nav id="menu">
      <span id="m-apps" class="pill">Apps instaladas</span>
      <span id="m-settings" class="pill">Ajustes</span>
      <span id="m-reload" class="pill">Recargar</span>
    </nav>
    <div class="right">
      <div id="clock">--:--</div>
      <div id="weather"></div>
    </div>
  </header>

  <div id="content">
    <main id="rows"><div id="rowsInner"></div></main>
    <aside id="widgets">
      <section id="w-forecast" class="widget hidden"></section>
      <section id="w-news" class="widget hidden"></section>
      <section id="w-ha" class="widget hidden"></section>
    </aside>
  </div>

  <div id="applist" class="panel"></div>
  <div id="settings" class="panel"></div>
  <div id="weatherPanel" class="panel"></div>
  <div id="newsPanel" class="panel"></div>
  <div id="saver"><div id="saverClock"></div></div>

  <footer>
    <span class="hint">↑ menú · → noticias y tiempo</span>
    <span id="status"></span>
  </footer>
  <script src="launcher.js"></script>
</body>
</html>
